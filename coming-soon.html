<!DOCTYPE html>
<html lang="en">
<head>
<title>Cubclipse — Coming Soon</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/img/logo-black.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<meta property="og:title" content="Cubclipse — Coming Soon">
<meta property="og:description" content="A lifestyle brand for the ones who curl up before they leap. Coming soon.">
</head>
<body>

<section class="hero" style="min-height:100vh;">
  <div class="hero-stars" id="heroStars"></div>
  <div class="hero-logo-wrap">
    <img src="assets/img/logo-white.webp" alt="Cubclipse sleeping fox emblem" style="filter:invert(1) brightness(1.4) sepia(1) saturate(2) hue-rotate(-10deg);">
  </div>
  <h1 class="serif">Cubclipse</h1>
  <div class="hero-est">
    <div class="divider"><span class="rule"></span><span class="eyebrow on-dark">Coming Soon</span><span class="rule"></span></div>
  </div>
  <p class="hero-tagline">A quiet corner for the ones who curl up before they leap. We're still curling this den into shape — leave your email and be the first in when we open.</p>

  <form class="news-form" id="csForm" style="margin-top:34px; border-bottom-color:var(--line-gold);">
    <input type="email" placeholder="your@email.com" required style="color:var(--cream-2);">
    <button type="submit" style="color:var(--gold);">Notify Me</button>
  </form>
  <div class="news-msg" id="csMsg" style="color:var(--gold-pale);">You're on the list — we'll email you the moment it drops. 🦊</div>

  <a href="#" class="follow-handle" style="margin-top:40px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    @cubclipse
  </a>
</section>

<script>
  const starsWrap = document.getElementById('heroStars');
  for(let i=0;i<40;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.opacity = (Math.random()*0.5+0.1).toFixed(2);
    starsWrap.appendChild(s);
  }
  document.getElementById('csForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    document.getElementById('csMsg').classList.add('show');
    e.target.reset();
  });
</script>

</body>
</html>
